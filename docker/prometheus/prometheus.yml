global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8081'  # sale-service
          - 'host.docker.internal:8082'  # invemtory-service
          - 'host.docker.internal:8083'  # payment-service
          - 'host.docker.internal:8084'  # orchestrator-service